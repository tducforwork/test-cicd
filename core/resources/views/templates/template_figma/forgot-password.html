<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | Quảng Phát Logistic</title>

    <!-- CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container top-bar-inner">
            <div class="top-bar-left">
                <span><i class="fa-solid fa-phone"></i> Hotline: 0987.xxx.xxx</span>
                <span><i class="fa-solid fa-location-dot"></i> Địa chỉ: Hà Nội, Việt Nam</span>
            </div>
            <div class="top-bar-right">
                <a href="#">Hướng dẫn mua hàng</a>
                <a href="#">Chính sách giao hàng</a>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="container header-inner">
            <div class="logo-container" style="display: flex; align-items: center;">
                <a href="index.html"><img src="assets/logo-white.png" alt="QUẢNG PHÁT"
                        style="height: 60px; display: block; object-fit: contain;"></a>
            </div>

            <div class="header-nav-items">
                <a href="index.html" class="header-nav-link">Trang chủ</a>
                <a href="products.html" class="header-nav-link">Sản phẩm</a>
                <a href="about.html" class="header-nav-link">Giới thiệu</a>
                <a href="lien-he.html" class="header-nav-link">Liên hệ</a>
            </div>

            <div class="header-tools">
                <div class="header-auth">
                    <a href="login.html" class="auth-btn auth-btn-login">Đăng nhập</a>
                    <a href="register.html" class="auth-btn auth-btn-register">Đăng ký</a>
                </div>
            </div>
        </div>
    </header>

    <!-- AUTH SECTION -->
    <section class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Khôi phục mật khẩu</h2>
                <p>Nhập email của bạn để nhận hướng dẫn khôi phục mật khẩu</p>
            </div>

            <form class="auth-form" id="forgotForm">
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" placeholder="Nhập email đăng ký của bạn" required>
                </div>

                <button type="submit" class="btn-auth">Gửi yêu cầu</button>

                <div class="auth-footer">
                    Quay lại <a href="login.html">Đăng nhập</a>
                </div>
            </form>
        </div>
    </section>

    <footer style="background: var(--primary); color: white; padding: 40px 0; margin-top: 0;">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 Quảng Phát Logistic. Tất cả quyền được bảo lưu.</p>
        </div>
    </footer>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Yêu cầu đã được gửi! Vui lòng kiểm tra email của bạn.');
            window.location.href = 'login.html';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
